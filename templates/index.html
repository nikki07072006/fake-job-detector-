<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fake Job Detector</title>

<style>

body{
font-family: Arial;
background: linear-gradient(135deg,#667eea,#764ba2);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
margin:0;
}

.container{
background:white;
padding:40px;
border-radius:15px;
width:600px;
text-align:center;
box-shadow:0px 10px 30px rgba(0,0,0,0.2);
}

h1{
color:#333;
margin-bottom:10px;
}

p{
color:#777;
margin-bottom:30px;
}

textarea{
width:100%;
height:140px;
border-radius:10px;
border:1px solid #ccc;
padding:12px;
font-size:16px;
resize:none;
outline:none;
}

textarea:focus{
border:1px solid #667eea;
}

button{
margin-top:20px;
background:#667eea;
color:white;
border:none;
padding:12px 30px;
font-size:18px;
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#5a67d8;
transform:scale(1.05);
}

.result{
margin-top:30px;
font-size:28px;
font-weight:bold;
}

.fake{
color:red;
}

.real{
color:green;
}

</style>
</head>

<body>

<div class="container">

<h1>🤖 Fake Job Offer Detector</h1>

<p>Paste a job message and our AI will detect if it is fake or real.</p>

<form method="POST">

<textarea name="message" placeholder="Paste job message here..." required>{{ message }}</textarea>

<br>

<button type="submit">Check Job</button>

</form>

{% if result is not none %}

<div class="result {{ result|lower }}">

Prediction: {{ result }}

</div>

{% endif %}

</div>

</body>
</html>
